services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - LLM_BASE_URL=${LLM_BASE_URL:-http://host.docker.internal:1234/v1}
      - LLM_API_KEY=${LLM_API_KEY:-lm-studio}
      - LLM_MODEL=${LLM_MODEL:-qwen2.5-14b-instruct}
      - POSTGRES_DSN=${POSTGRES_DSN:-postgresql://rubato:rubato@db:5432/rubato}
    extra_hosts:
      # Lets the container reach LM Studio running on the host machine.
      - "host.docker.internal:host-gateway"
    volumes:
      - ./app:/srv/app
      - ./data:/srv/data
      - ./docs:/srv/docs
    depends_on: []
    # depends_on:
    #   - db

